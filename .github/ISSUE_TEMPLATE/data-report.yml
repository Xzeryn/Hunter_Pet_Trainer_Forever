name: Game data report
description: Trainer and pet data from the in-game Report button (/hpt report)
title: "Data report: "
labels: ["data-report"]
body:
  - type: markdown
    attributes:
      value: |
        This form is filled in by **Report** (`/hpt report`, or `/hpt dev` → Report).
        It is a snapshot of the current pet and Beast Training list, plus anything that differs from the addon's data.
        Very long reports are compressed (`HPTZ1:`); the addon shows the readable text before you open it. Please don't edit the report.
  - type: textarea
    id: report
    attributes:
      label: Report
      description: Generated by Hunter Pet Trainer Forever.
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional. Anything else you noticed, like how the pet learned an ability or where it was tamed.
